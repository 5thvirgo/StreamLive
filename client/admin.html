<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StreamLive — Create match</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="logo">Stream<span>Live</span></div>
    <nav>
      <a href="/index.html">Matches</a>
      <a href="/scores.html">Scores</a>
      <a href="/admin.html">Create match</a>
    </nav>
  </header>
  <main>
    <a class="back-link" href="/index.html">&larr; Back to matches</a>
    <h2>Create a match</h2>
    <div class="panel">
      <label>Match title</label>
      <input type="text" id="title" placeholder="Matchday 4" />
      <label>Home team</label>
      <input type="text" id="homeTeam" placeholder="Red FC" />
      <label>Away team</label>
      <input type="text" id="awayTeam" placeholder="Blue United" />
      <label>Kickoff date &amp; time</label>
      <input type="datetime-local" id="kickoff" />
      <button id="createBtn">Create match</button>

      <div class="result" id="result">
        <div>Give this to your encoder (OBS, camera, or the demo script):</div>
        <div style="margin-top:10px;">Server URL</div>
        <code id="rtmpUrl"></code>
        <div>Stream key</div>
        <code id="streamKey"></code>
        <div>Once you start publishing, the match goes live automatically on the matches page.</div>
        <a id="watchLink" href="#" style="color:#4f7cff; display:inline-block; margin-top:12px;">Open watch page &rarr;</a>
      </div>
    </div>
  </main>

  <script src="/reminders.js"></script>
  <script>
    document.getElementById('createBtn').addEventListener('click', async () => {
      const title = document.getElementById('title').value.trim();
      const homeTeam = document.getElementById('homeTeam').value.trim();
      const awayTeam = document.getElementById('awayTeam').value.trim();
      const kickoffLocal = document.getElementById('kickoff').value;
      if (!title || !homeTeam || !awayTeam || !kickoffLocal) {
        alert('Please fill in all fields.');
        return;
      }
      const kickoff = new Date(kickoffLocal).toISOString();
      const res = await fetch('/api/matches', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, homeTeam, awayTeam, kickoff }),
      });
      if (!res.ok) {
        alert('Failed to create match.');
        return;
      }
      const match = await res.json();
      document.getElementById('rtmpUrl').textContent = match.rtmpUrl;
      document.getElementById('streamKey').textContent = match.streamKey;
      document.getElementById('watchLink').href = `/watch.html?id=${match.id}`;
      document.getElementById('result').style.display = 'block';
    });
  </script>
</body>
</html>
